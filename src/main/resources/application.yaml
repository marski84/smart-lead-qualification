spring:
  application:
    name: smart-lead-qualification
  datasource:
    url: jdbc:postgresql://localhost:54320/postgres?currentSchema=smart_lead
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    default-schema: smart_lead
    schemas: smart_lead
  jpa:
    properties:
      hibernate:
        default_schema: smart_lead
  data:
    web:
      pageable:
        max-page-size: 100
  ai:
    openai:
      api-key: ${API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-20b
        temperature: 0
        reasoning-effort: low
        max-retries: 2
        timeout: 10s
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none