spring:
  application:
    name: smart-lead-qualification
  datasource:
    url: jdbc:h2:mem:smart_lead_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    default-schema: smart_lead
    schemas: smart_lead
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: smart_lead
  ai:
    openai:
      api-key: test-key
      base-url: http://localhost:1/v1
      chat:
        model: test-model
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
