spring:
  application:
    name: smart-lead-qualification
  datasource:
    url: jdbc:h2:mem:smart_lead_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    default-schema: smart_lead
    schemas: smart_lead
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: smart_lead

qualificator:
  api:
    url: http://localhost:0/responses
    model: test-model
    token: test-token
